# ============================================================
# Nginx Config — shilyciaDEV Smart Gateway
# Semua domain dirouting lewat Gateway port 8080
# sehingga status project (production/maintenance/build)
# yang diatur di panel berfungsi dengan benar.
#
# Letakkan di: /etc/nginx/sites-available/shilycia-gateway
# Aktifkan:    sudo ln -sf /etc/nginx/sites-available/shilycia-gateway /etc/nginx/sites-enabled/
# Test:        sudo nginx -t
# Reload:      sudo systemctl reload nginx
# ============================================================

# ---- nadyakhiarapurnomo.my.id ----
server {
    listen 80;
    server_name nadyakhiarapurnomo.my.id www.nadyakhiarapurnomo.my.id;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

