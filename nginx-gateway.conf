# ============================================================
# Nginx Config — shilyciaDEV Smart Gateway
# ============================================================

# 1. Rate Limiting Zone untuk Login (Maksimum 5 request per detik per IP, burst 10)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

# 2. Map untuk Connection Upgrade (WebSocket)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- nadyakhiarapurnomo.my.id ----
server {
    listen 80;
    server_name nadyakhiarapurnomo.my.id www.nadyakhiarapurnomo.my.id;

    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: wss: data:; frame-ancestors 'self';" always;

    # Fallback Error Pages
    error_page 502 503 504 /preview/maintenance;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # GZIP & Cache untuk Next.js static assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_proxied any;
        gzip_min_length 1000;
    }

    # Rate limit khusus untuk endpoint login
    location /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long timeout khusus untuk terminal stream SSE
    location /api/terminal/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---- IP Langsung (fallback / block) ----
server {
    listen 80;
    server_name 43.173.33.116;
    
    # Blokir akses IP langsung
    return 444;
}
